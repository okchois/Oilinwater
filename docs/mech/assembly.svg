<text x="20" y="535" font-size="14" font-weight="700" fill="#0f172a">부품 구성</text>
<text x="20" y="560" font-size="12" fill="#1e293b">① 보호캡 — SUS316L, 측면 구멍 Ø2.6×8 + 끝단 구멍, 교체형(나사 결합), 옵션: 소결 필터</text>
<text x="20" y="582" font-size="12" fill="#1e293b">② 센서 헤드 — IST MK 정전용량 소자 + Pt1000, 세라믹/폴리이미드 캐리어, 오일 노출</text>
<text x="20" y="604" font-size="12" fill="#1e293b">③ 캡 결합부 — M10×0.75 나사 + 풀림 방지(록타이트 또는 코킹)</text>
<text x="20" y="626" font-size="12" fill="#1e293b">④ 압력 격벽 — 유리-금속 밀봉(GTMS) 피드스루 4~6핀, 50 bar 기본 / 200 bar 고압형</text>
<text x="20" y="648" font-size="12" fill="#1e293b">⑤ 프로세스 바디 — SUS316L 일체 선삭: 프로브 튜브 + G½ ISO 228-1 + 언더컷</text>
<text x="20" y="670" font-size="12" fill="#1e293b">⑥ 본디드 씰 — G½용 USIT/DIN 3869 형, 금속+FKM (에스테르유: EPDM/FFKM)</text>
<text x="600" y="560" font-size="12" fill="#1e293b">⑦ 육각 SW27 — 체결 토크 부위, 바디와 일체</text>
<text x="600" y="582" font-size="12" fill="#1e293b">⑧ 하우징 튜브 — SUS316L Ø30×62, 두께 1.5, 레이저 마킹 라벨</text>
<text x="600" y="604" font-size="12" fill="#1e293b">⑨ PCB 2장 — Ø26 원형 4층: 측정 보드(피드스루 쪽) / 전원·출력 보드</text>
<text x="600" y="626" font-size="12" fill="#1e293b">⑩ 결합부 1 — 바디–하우징 레이저 용접 또는 나사+O링 (적색 점선)</text>
<text x="600" y="648" font-size="12" fill="#1e293b">⑪ 엔드캡 — SUS316L, 커넥터 체결·O링 밀봉, IP67</text>
<text x="600" y="670" font-size="12" fill="#1e293b">⑫ M Connect 8핀 수컷 — 패널형, PCB에 FPC/리드로 연결</text>
<text x="20" y="705" font-size="11" fill="#64748b">점선 = 내부 부품 · 녹색 링 = 본디드 씰 · 적색 점선 = 용접/결합부 · 모든 치수는 시제품 전 설계안이며 PCB 외형·피드스루 선정 후 확정</text>
</svg>