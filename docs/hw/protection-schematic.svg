<text x="748" y="690" class="t">① 외부 핀의 TVS는 모두 양방향, 동작전압 ≥ 33 V</text>
<text x="748" y="710" class="t">   → −30 V 오결선에서 TVS가 도통하지 않음</text>
<text x="748" y="730" class="t">② 1단(대용량 TVS) → 직렬 저항 → 2단(소형 TVS)</text>
<text x="748" y="750" class="t">   → 잔류 전압을 IC 정격 이하로</text>
<text x="748" y="770" class="t">③ 오결선은 IC가 차단: TPS2660 / TPS2661 / THVD2450</text>
<text x="748" y="790" class="t">   → 퓨즈 교체 없이 자동 복귀</text>
<text x="748" y="810" class="t">④ 1, 7번 핀은 PCB에서 연결하지 않음 (NC)</text>
<text x="748" y="830" class="t">⑤ PCB–하우징 연면·공간거리 ≥ 2 mm</text>
<text x="748" y="850" class="t">⑥ 모든 FLT/ALARM 신호는 MCU가 기록 → Modbus 상태</text>
