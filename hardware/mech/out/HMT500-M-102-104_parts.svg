<text x="18.000" y="247.000" font-size="3.6" text-anchor="start" font-weight="700" class="t ">주기 (NOTES)</text>
<text x="18.000" y="253.200" font-size="3.0" text-anchor="start" class="t ">1. 재질 SUS316L (1.4404), 재질성적서 EN 10204 3.1, 부동태 처리 (ASTM A967).</text>
<text x="18.000" y="259.400" font-size="3.0" text-anchor="start" class="t ">2. 지정 없는 모서리 C0.3, 버 제거. 지정 외 표면 Ra 1.6. 일반공차 ISO 2768-mK.</text>
<text x="18.000" y="265.600" font-size="3.0" text-anchor="start" class="t ">3. ③–① (Ø27 H7/h7), ③–④ 끼워맞춤 후 전둘레 레이저 용접 (시제품: 나사+O링 대안).</text>
<text x="18.000" y="271.800" font-size="3.0" text-anchor="start" class="t ">4. ② 보호캡 구멍 가공 후 내부 버 완전 제거 (센서 손상 방지).</text>
