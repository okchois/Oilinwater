<text x="18.000" y="205.000" font-size="3.6" text-anchor="start" font-weight="700" class="t ">주기 (NOTES)</text>
<text x="18.000" y="211.200" font-size="3.1" text-anchor="start" class="t ">1. 재질 SUS316L (1.4404), 봉재 선삭. 재질성적서 EN 10204 3.1.</text>
<text x="18.000" y="217.400" font-size="3.1" text-anchor="start" class="t ">2. 지정 없는 모서리 C0.3, 날카로운 모서리 제거. 지정 외 표면 Ra 1.6.</text>
<text x="18.000" y="223.600" font-size="3.1" text-anchor="start" class="t ">3. 씰면(기준면 A) Ra 0.8, 평면도 0.02, 공구 자국 반경 방향 금지 (씰 누설 방지).</text>
<text x="18.000" y="229.800" font-size="3.1" text-anchor="start" class="t ">4. Ø8 H7 안착부에 피드스루 레이저 용접: 용접 전 세척(오일·이물 제거).</text>
<text x="18.000" y="236.000" font-size="3.1" text-anchor="start" class="t ">5. 나사 G1/2-A: ISO 228-1, 불완전 나사부는 언더컷(2)에 포함.</text>
<text x="18.000" y="242.200" font-size="3.1" text-anchor="start" class="t ">6. 전해 연마 또는 부동태 처리 (ASTM A967).</text>
<text x="18.000" y="248.400" font-size="3.1" text-anchor="start" class="t ">7. 내압 설계: 정격 50 bar (200 bar형 동일 형상 검토 — 피드스루 사양에 따름).</text>
